name: ci

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Structure and quality gate
        run: python -B tools/package_skill.py --check
      - name: Plan gate tests
        run: node --test tools/test_plan.mjs
      - name: Packaging tests
        run: python -B -m unittest discover -s tools -p "test_*.py"
