name: ci

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Windows runs the same gates because several behaviours under test are Windows-specific:
    # drive-letter/backslash normalisation, BOM tolerance and the junction/symlink output guard.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Cover the declared floor and a newer line for both runtimes: README promises
        # Node 18+ and Python 3.10+, so testing only 3.11/20 would leave the floor unproven.
        python: ["3.10", "3.11"]
        node: ["18", "20"]
    runs-on: ${{ matrix.os }}
    # A hung runner would otherwise wait out the 360-minute default and hide the failure.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Structure and quality gate
        run: python -B tools/package_skill.py --check
      - name: Plan gate tests
        run: node --test tools/test_plan.mjs
      - name: Packaging tests
        run: python -B -m unittest discover -s tools -p "test_*.py"
