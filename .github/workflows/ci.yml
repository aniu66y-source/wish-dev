name: ci

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Windows runs the same gates because several behaviours under test are Windows-specific:
    # drive-letter/backslash normalisation, BOM tolerance and the junction/symlink output guard.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Cover the declared floor and a newer line for both runtimes: README promises
        # Node 18+ and Python 3.10+, so testing only 3.11/20 would leave the floor unproven.
        python: ["3.10", "3.11"]
        node: ["18", "20"]
    runs-on: ${{ matrix.os }}
    # A hung runner would otherwise wait out the 360-minute default and hide the failure.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Structure and quality gate
        run: python -B tools/package_skill.py --check
      - name: Plan gate tests
        run: node --test tools/test_plan.mjs
      - name: Packaging tests
        run: python -B -m unittest discover -s tools -p "test_*.py"
      - name: Packaging artifact boundary
        # Independent cross-check of the packaging triple with a different reader
        # (.NET ZipFile vs the Python packager) so a systemic packager bug cannot
        # satisfy its own gate. Runs on both runner OSes via pwsh.
        shell: pwsh
        run: |
          python -B tools/package_skill.py --output .ci/wish-dev-ci.zip
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $manifest = Get-Content .ci/wish-dev-ci.manifest.json -Raw | ConvertFrom-Json
          $actual = (Get-FileHash .ci/wish-dev-ci.zip -Algorithm SHA256).Hash.ToLower()
          if ($manifest.sha256 -ne $actual) { throw "manifest sha256 does not match archive" }
          if ((Get-Item .ci/wish-dev-ci.zip).Length -ne $manifest.bytes) { throw "zip byte length differs from manifest" }
          $recorded = (Get-Content .ci/wish-dev-ci.zip.sha256 -Raw).Trim()
          if ($recorded -ne "$actual  wish-dev-ci.zip") { throw "checksum file does not match: $recorded" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path .ci/wish-dev-ci.zip).Path)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName }) | Sort-Object
            $want = @($manifest.files) | Sort-Object
            if ($entries.Count -ne $want.Count) { throw "zip entry count $($entries.Count) != manifest $($want.Count)" }
            for ($i = 0; $i -lt $entries.Count; $i++) {
              $entry = $entries[$i]
              if ($entry -ne $want[$i]) { throw "zip entry differs from manifest at index $i : $entry" }
              if (-not $entry.StartsWith("wish-dev/")) { throw "entry escapes skill root: $entry" }
              if ($entry -match ':') { throw "entry carries a drive letter or URI: $entry" }
              if ($entry -match '^/') { throw "entry is absolute: $entry" }
            }
          } finally { $zip.Dispose() }
          Write-Output ("packaging artifact boundary OK: " + $entries.Count + " entries")
